# Builds the backend image and pushes it to Artifact Registry.
#
#   gcloud builds submit --config deploy/cloudbuild.backend.yaml .
#
# Run from the repository root: the build context is the whole repo, because
# Dockerfile.cloudrun copies pyproject.toml, backend/app and deploy/start.sh.
substitutions:
  _REGION: asia-south1
  _REPO: forge-images
  _IMAGE: backend

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.cloudrun
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8   # the image installs node, npm, git and the Python deps
timeout: 1800s
